{% extends "base.html" %}
{% load django_bootstrap5 %}

{% block main %}
<div class="container my-4">
    {% if errors %}
        <div class="alert alert-danger" role="alert">
            <strong>入力エラーがあります：</strong>
            <ul class="mb-0">
                {% for error in errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="card border-secondary">
            <div class="card-header bg-light">
                <h4 class="mb-0">商品の編集</h4>
            </div>
            <table class="table">
                <tbody>
                    <tr>
                        <td><label for="{{ product_form.id_for_label }}">商品名</label></td>
                        <td>{{ product_form.name }}</td>
                    </tr>
                    <tr>
                        <td><label for="{{ product_form.id_for_label }}">参考情報</label></td>
                        <td>{{ product_form.reference }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-right">
            <button type="submit" class="btn btn-outline-secondary">保存</button>
        </div>
    </form>
</div>
{% endblock %}
